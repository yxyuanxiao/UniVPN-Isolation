logoutput: /tmp/danted.log

# Apple Container publishes this service only on macOS 127.0.0.1.
internal: eth0 port = 5900
external: cnem_vnic

clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

client pass {
    from: ::/0 to: ::/0
    log: connect disconnect error
}

client block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

# The proxy is incapable of relaying anything outside the requested subnet.
socks pass {
    from: 0.0.0.0/0 to: 10.10.128.0/24
    command: connect
    protocol: tcp
    log: connect disconnect error
}

socks pass {
    from: ::/0 to: 10.10.128.0/24
    command: connect
    protocol: tcp
    log: connect disconnect error
}

socks block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}
